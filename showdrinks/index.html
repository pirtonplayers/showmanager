<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>ShowDrinks</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css?v=1.0.141">
  <style>
    .pwa-body { min-height: 100vh; display: flex; flex-direction: column; background: var(--primary); }
    .pwa-content { flex: 1; background: var(--bg); border-radius: 24px 24px 0 0; margin-top: 8px; padding: 24px 20px 40px; overflow-y: auto; }
    .screen { display: none; }
    .screen.active { display: block; }

    .pwa-hero { text-align: center; padding: 32px 20px 16px; color: #fff; }
    .pwa-hero svg { width: 64px; height: 64px; margin-bottom: 12px; opacity: .9; }
    .pwa-hero h1 { font-size: 28px; font-weight: 800; letter-spacing: -.5px; }
    .pwa-hero p { font-size: 15px; opacity: .8; margin-top: 6px; }

    .name-input-wrap { max-width: 400px; margin: 0 auto; }
    .big-input { font-size: 24px; font-weight: 700; text-align: center; height: 64px; border-radius: 12px; }

    .selector-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
    .selector-btn { padding: 16px 12px; border: 2px solid var(--border); border-radius: var(--radius); background: var(--surface); cursor: pointer; text-align: center; font-weight: 600; font-size: 15px; transition: all .15s; width: 100%; }
    .selector-btn:hover:not(.unavailable) { border-color: var(--primary); color: var(--primary); }
    .selector-btn.selected { border-color: var(--primary); background: var(--primary-light); color: var(--primary); }
    .selector-btn.unavailable { opacity: .4; cursor: not-allowed; background: var(--bg); }
    .selector-btn .sub { font-size: 12px; font-weight: 400; color: var(--text-muted); display: block; margin-top: 4px; }
    .selector-btn.selected .sub { color: var(--primary); }

    .menu-grid { display: flex; flex-direction: column; gap: 10px; }
    .menu-item-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; display: flex; align-items: center; gap: 12px; box-shadow: var(--shadow); }
    .mic-name { flex: 1; font-weight: 600; font-size: 15px; }
    .mic-price { font-weight: 700; color: var(--primary); font-size: 15px; min-width: 50px; text-align: right; }
    .qty-control { display: flex; align-items: center; gap: 8px; }
    .qty-control button { width: 34px; height: 34px; border-radius: 50%; border: 2px solid var(--primary); background: none; color: var(--primary); font-size: 22px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; line-height: 1; transition: all .15s; }
    .qty-control button:hover { background: var(--primary); color: #fff; }
    .qty-control .qty-num { font-weight: 700; font-size: 17px; min-width: 24px; text-align: center; }

    .order-summary-list { display: flex; flex-direction: column; gap: 6px; margin-bottom: 16px; }
    .order-summary-row { display: flex; align-items: center; gap: 8px; font-size: 15px; }
    .osq { font-weight: 700; color: var(--primary); min-width: 28px; }
    .osn { flex: 1; }
    .osp { font-weight: 600; }
    .order-total-line { display: flex; justify-content: space-between; font-size: 19px; font-weight: 800; padding: 14px 0; border-top: 2px solid var(--border); margin-top: 8px; }

    .info-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 16px; }
    .info-row { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 8px; }
    .info-row:last-child { margin-bottom: 0; }
    .info-label { color: var(--text-muted); }
    .info-value { font-weight: 600; }

    .status-screen { text-align: center; padding: 24px 0; }
    .status-icon-wrap { width: 100px; height: 100px; border-radius: 50%; display: flex; align-items: center; justify-content: center; margin: 0 auto 20px; font-size: 52px; }
    .status-icon-wrap.pending { background: var(--warning-light); }
    .status-icon-wrap.ready { background: var(--success-light); }
    .status-title { font-size: 26px; font-weight: 800; margin-bottom: 8px; }
    .status-sub { font-size: 15px; color: var(--text-muted); margin-bottom: 24px; }
    .location-banner { background: var(--success-light); color: var(--success); padding: 20px; border-radius: 12px; font-size: 20px; font-weight: 800; margin-bottom: 16px; }
    .location-banner .loc-label { font-size: 13px; font-weight: 500; opacity: .8; display: block; margin-bottom: 4px; }
    .pay-at-bar-banner { background: var(--danger-light); color: var(--danger); padding: 16px; border-radius: 12px; font-size: 16px; font-weight: 700; margin-bottom: 16px; text-align: center; }

    .bottom-bar { padding: 16px 20px; background: var(--bg); border-top: 1px solid var(--border); display: flex; gap: 10px; position: sticky; bottom: 0; }
    .bottom-bar .btn { flex: 1; height: 52px; font-size: 16px; border-radius: 12px; }

    #checkOrderInput { display: flex; gap: 8px; margin-top: 16px; }

    .welcome-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 16px 20px; display: flex; align-items: center; gap: 12px; margin-bottom: 20px; box-shadow: var(--shadow); }
    .wc-emoji { font-size: 28px; }
    .wc-name { flex: 1; font-size: 20px; font-weight: 700; }
    .section-label { font-size: 13px; font-weight: 600; color: var(--text-muted); text-transform: uppercase; letter-spacing: .05em; margin-bottom: 10px; }
    .past-order-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 8px; display: flex; align-items: center; gap: 12px; cursor: pointer; transition: border-color .15s, box-shadow .15s; box-shadow: var(--shadow); }
    .past-order-card:hover { border-color: var(--primary); box-shadow: var(--shadow-md); }
    .past-order-card.ready { border-color: var(--success); }
    .past-order-info { flex: 1; }
    .poi-session { font-weight: 600; font-size: 15px; }
    .poi-detail { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .poi-right { text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
    .poi-total { font-size: 13px; font-weight: 600; color: var(--text-muted); }

    .switch-label { display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 500; color: var(--text-muted); cursor: pointer; user-select: none; }
    .switch-label input { position: absolute; opacity: 0; width: 0; height: 0; }
    .switch { position: relative; width: 38px; height: 22px; background: var(--border); border-radius: 999px; transition: background .15s; flex-shrink: 0; }
    .switch::before { content: ''; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; background: #fff; border-radius: 50%; transition: transform .15s; box-shadow: 0 1px 2px rgba(0,0,0,.2); }
    .switch-label input:checked + .switch { background: var(--primary); }
    .switch-label input:checked + .switch::before { transform: translateX(16px); }
    .switch-label input:focus-visible + .switch { outline: 2px solid var(--primary); outline-offset: 2px; }

    .pulse { animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:.6; } }

    /* padding-top adds the safe-area inset on top of the banner's own padding, rather than
       replacing it — on a notched/status-bar phone, position:fixed;top:0 alone put its content
       (including the tap target) right under that unsafe area, hard or impossible to tap. */
    #updateBanner { display:none; position:fixed; top:0; left:0; right:0; z-index:9999; background:#1e1b4b; color:#fff; padding:calc(10px + env(safe-area-inset-top)) 16px 10px; align-items:center; justify-content:center; gap:14px; font-size:14px; font-weight:500; flex-wrap:wrap; }
    #updateBanner.visible { display:flex; }

    /* Compact hero on sub-screens */
    .sub-screen .pwa-hero { padding:8px 20px 4px; display:flex; align-items:center; gap:10px; text-align:left; }
    .sub-screen .pwa-hero svg { display:none; }
    .sub-screen .pwa-hero h1 { font-size:14px; font-weight:700; margin:0; }
    .sub-screen .pwa-hero p { display:none; }
    .sub-screen .pwa-content { padding-top:16px; }

    /* Screen 2 POS mode — hide chrome, fill viewport */
    .pos-screen .pwa-hero { display:none; }
    .pos-screen .pwa-content { padding:10px 12px 12px; display:flex; flex-direction:column; height:calc(100vh - env(safe-area-inset-top)); height:calc(100dvh - env(safe-area-inset-top)); box-sizing:border-box; overflow:hidden; }
    .pos-screen #screen1 { flex:1; display:flex; flex-direction:column; overflow:hidden; min-height:0; }
    .pos-screen .order-grid-pane { flex:0 0 calc(40% - 24px); height:auto; max-height:none; overflow-y:auto; }
    .pos-screen #posGrid { flex:0 0 60%; overflow-y:auto; min-height:0; }

    /* Screen 1 category-list mode. The itemized cart pane isn't shown here at all (each item
       already has its own +/- stepper inline below) — instead the header doubles as a mini
       basket: running total, trolley icon that's the only way to reach Review in this mode.

       .pwa-body itself needs a genuine capped height here — a previous fix gave .pwa-content its
       own explicit height instead, which engaged its overflow-y:auto but didn't account for
       .pwa-hero's own height (shown in this mode, unlike .pos-screen, which hides it): hero +
       content's fixed height together came to *more* than the viewport, so .pwa-body (still only
       min-height:100vh at its base rule) grew past 100vh anyway, leaving the outer page with a
       sliver of its own scroll room. A touch swipe on a phone grabs that outer document scroll
       readily, dragging #listCatBar along with everything else — it's only sticky relative to
       .pwa-content's own internal scroll, not the document, so from the outside it looked like it
       simply wasn't sticking at all. Capping .pwa-body itself instead means flexbox sizes
       .pwa-content to genuinely "whatever's left after the hero" via its own flex:1 (the base
       .pwa-content rule already has that, plus overflow-y:auto) — no separate override needed. */
    .list-screen .pwa-body { height:100vh; height:100dvh; overflow:hidden; }
    #listMenu { padding-bottom:12px; }
    #listMenu .section-label { margin-top:18px; }
    #listMenu .section-label:first-child { margin-top:0; }

    #heroBasketBtn { display:none; }
    .list-screen .pwa-hero { display:grid; grid-template-columns:1fr auto; align-items:center; padding:10px 20px; }
    /* One solid pill button — same idea as Bar Tabs POS's basket bar, just inverted (white on
       the hero's own primary-colour background instead of primary on white) so it still reads
       as a distinct, obviously-tappable button rather than blending into the header. Shows the
       running total, not an item count — nothing here needs a per-item badge. */
    .list-screen #heroBasketBtn { display:flex; flex-direction:column; align-items:center; gap:1px; justify-self:end; background:#fff; color:var(--primary); border:none; border-radius:999px; padding:6px 20px; cursor:pointer; }
    .list-screen #heroBasketBtn:disabled { opacity:.5; cursor:not-allowed; }
    .hero-basket-row { display:flex; align-items:center; gap:8px; }
    .hero-basket-svg { width:26px; height:26px; display:block; }
    .hero-basket-total-text { font-size:20px; font-weight:800; }
    .hero-basket-caption { font-size:10px; font-weight:600; opacity:.75; text-transform:uppercase; letter-spacing:.03em; }

    /* Category slider — sticky row of category chips along the top of the category list, so it
       stays put as the item list scrolls underneath it. Tapping a chip jumps to that category;
       the active chip tracks whichever category is currently in view. */
    .cat-bar { display:flex; gap:8px; overflow-x:auto; flex-wrap:nowrap; scrollbar-width:none; -webkit-overflow-scrolling:touch; }
    .cat-bar::-webkit-scrollbar { display:none; }
    .cat-btn { flex:0 0 auto; white-space:nowrap; padding:7px 14px; border:2px solid var(--border); border-radius:999px; background:var(--surface); font-size:13px; font-weight:600; cursor:pointer; transition:all .15s; }
    .cat-btn.active { border-color:var(--primary); background:var(--primary); color:#fff; }
    .list-screen #listCatBar { position:sticky; top:0; z-index:5; background:var(--bg); margin:0 -20px 10px; padding:8px 20px 10px; }

    /* 2-column item grid */
    .items-2col { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:14px; }
    .item-card { background:var(--surface); border:2px solid var(--border); border-radius:var(--radius); padding:10px 10px 8px; display:flex; flex-direction:column; gap:4px; transition:border-color .15s; cursor:default; }
    .item-card.has-qty { border-color:var(--primary); }
    .ic-name { font-weight:600; font-size:13px; line-height:1.25; }
    .ic-price { font-size:13px; font-weight:700; color:var(--primary); }
    .ic-qty { display:flex; align-items:center; gap:0; margin-top:6px; }
    .ic-qty button { width:28px; height:28px; border-radius:50%; border:2px solid var(--primary); background:none; color:var(--primary); font-size:18px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .ic-qty button:active { background:var(--primary); color:#fff; }
    .ic-qty .qn { font-weight:800; font-size:15px; flex:1; text-align:center; }

    /* Order grid pane (top of screen 2) */
    .order-grid-pane { height:40vh; overflow-y:auto; border:1px solid var(--border); border-radius:var(--radius); background:var(--surface); box-shadow:var(--shadow); margin-bottom:8px; display:flex; flex-direction:column; }
    .og-header { display:flex; justify-content:space-between; align-items:center; padding:8px 12px; background:var(--primary); color:#fff; font-size:13px; font-weight:700; position:sticky; top:0; z-index:1; flex-shrink:0; }
    .og-edit-info { font-size:11px; opacity:.8; }
    .og-rows { flex:1; overflow-y:auto; }
    .og-row { display:grid; grid-template-columns:auto 1fr auto auto; align-items:center; gap:8px; padding:4px 12px; border-top:1px solid var(--border); font-size:13px; cursor:pointer; }
    .og-row.selected { background:var(--primary-light); }
    .og-row:hover { background:var(--bg); }
    .og-row.selected:hover { background:var(--primary-light); }
    .og-qty { font-weight:700; color:var(--primary); }
    .og-price { font-weight:600; text-align:right; }
    .og-trash { background:none; border:none; color:var(--text-muted); cursor:pointer; font-size:15px; padding:2px 4px; transition:color .15s; line-height:1; }
    .og-trash:hover { color:var(--danger); }
    .og-total { display:flex; justify-content:space-between; align-items:center; padding:8px 12px; border-top:2px solid var(--border); font-size:28px; font-weight:800; background:var(--bg); position:sticky; bottom:0; flex-shrink:0; }
    .og-empty { flex:1; display:flex; align-items:center; justify-content:center; color:var(--text-muted); font-size:13px; padding:16px; text-align:center; }

    /* Item catalog buttons (bottom half of screen 2) */
    .item-btns-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; }
    .item-btn { background:var(--surface); border:1.5px solid var(--border); border-radius:var(--radius); padding:8px 6px 7px; display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer; transition:border-color .12s, background .12s; text-align:center; width:100%; }
    .item-btn:active { background:var(--primary-light); border-color:var(--primary); }
    .ib-name { font-size:12px; font-weight:600; line-height:1.2; }
    .ib-price { font-size:12px; font-weight:700; color:var(--primary); }

    .review-status-row { background:var(--primary-light); color:var(--primary); border-radius:10px; padding:10px 14px; font-weight:700; font-size:14px; }

    /* Session buttons on the home screen */
    .session-btn-grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(100px,1fr)); gap:10px; margin:4px 0 20px; }

    /* Collected order state */
    .past-order-card.collected { opacity:.55; border-color:var(--border); }

    /* A ready order expands right here on the home screen instead of needing the status screen —
       collect-location line + the collect button live directly on the card. */
    .past-order-card.ready-expanded { flex-direction:column; align-items:stretch; gap:10px; cursor:default; }
    .past-order-card.ready-expanded .past-order-info { display:flex; justify-content:space-between; align-items:baseline; cursor:pointer; }
    .poi-ready-line { font-size:16px; font-weight:700; color:var(--success); }
    .status-icon-wrap.collected { background:#f1f5f9; }
  </style>
</head>
<body>

<div id="updateBanner">
  <span>New version available</span>
  <button id="updateBtn" class="btn btn-primary btn-sm" style="background:#6366f1">Update now</button>
</div>

<div class="pwa-body" style="padding-top:env(safe-area-inset-top)">
  <div class="pwa-hero">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
      <path d="M8 22h8M12 22v-4M6 2h12l-1 7H7L6 2zM7 9c0 5 10 5 10 0"/>
    </svg>
    <h1 id="heroShowName">ShowDrinks</h1>
    <p>Pre-order your drinks</p>
    <p style="font-size:11px;opacity:.4;margin-top:4px" id="heroVersion"></p>
    <button type="button" id="heroBasketBtn" onclick="goToListBasket()" title="View basket">
      <span class="hero-basket-row">
        <svg class="hero-basket-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        <span id="heroBasketTotal" class="hero-basket-total-text">£0.00</span>
      </span>
      <span class="hero-basket-caption">Tap to checkout</span>
    </button>
  </div>

  <div class="pwa-content">

    <!-- Screen 0: Home — rendered dynamically by order.js -->
    <div class="screen active" id="screen0">
      <div id="homeContent"></div>
    </div>

    <!-- Screen 1: Order (also edit/view mode for existing orders) -->
    <div class="screen" id="screen1">
      <div class="order-grid-pane" id="orderGridPane"></div>
      <div id="posGrid"></div>
      <div id="listCatBar" class="cat-bar" style="display:none"></div>
      <div id="listMenu" style="display:none"></div>
    </div>

    <!-- Screen 2: Review & Pay -->
    <div class="screen" id="screen2">
      <div class="pwa-section-title">Order Summary</div>
      <div id="reviewStatus" style="display:none;margin-bottom:12px"></div>

      <div class="info-card">
        <div class="info-row"><span class="info-label">Name</span><span class="info-value" id="reviewName"></span></div>
        <div class="info-row"><span class="info-label">Date</span><span class="info-value" id="reviewDate"></span></div>
        <div class="info-row"><span class="info-label">Session</span><span class="info-value" id="reviewSession"></span></div>
      </div>

      <div class="order-summary-list" id="reviewItems"></div>
      <div class="order-total-line">
        <span>Total</span>
        <span id="reviewTotal"></span>
      </div>

      <div id="paymentSection" style="margin-top:20px">
        <div id="payAtBarSection">
          <button class="btn btn-primary btn-full btn-lg" style="height:52px;border-radius:12px" id="payAtBarBtn">
            Confirm Order (Pay at Bar)
          </button>
        </div>
        <div id="sumupSection" style="display:none">
          <button class="btn btn-primary btn-full btn-lg" style="height:52px;border-radius:12px;background:#00b4d8" id="payOnlineBtn">
            💳 Pay Online with SumUp
          </button>
          <p style="text-align:center;font-size:12px;color:var(--text-muted);margin-top:8px">
            You'll be taken to a secure payment page.
          </p>
        </div>
      </div>
    </div>

    <!-- Screen 3: Confirmation & Status -->
    <div class="screen" id="screen3">
      <div class="status-screen" id="orderStatus">
        <div class="status-icon-wrap pending" id="statusIcon"></div>
        <div id="confOrderNum" style="font-size:42px;font-weight:900;color:var(--primary);letter-spacing:-1px;margin-bottom:4px"></div>
        <div class="status-title" id="statusTitle">Order Received!</div>
        <div class="status-sub" id="statusSub">We're getting your drinks ready.</div>

        <div class="pay-at-bar-banner" id="payAtBarBanner" style="display:none">💵 Please pay at the bar</div>

        <div class="location-banner" id="locationBanner" style="display:none">
          <span class="loc-label">Collect from</span>
          <span id="locationText"></span>
        </div>

        <div class="info-card" style="text-align:left">
          <div class="info-row"><span class="info-label">Name</span><span class="info-value" id="confName"></span></div>
          <div class="info-row"><span class="info-label">Date</span><span class="info-value" id="confDate"></span></div>
          <div class="info-row"><span class="info-label">Session</span><span class="info-value" id="confSession"></span></div>
          <div class="info-row"><span class="info-label">Total</span><span class="info-value" id="confTotal"></span></div>
        </div>

        <button class="btn btn-success btn-full" style="margin-top:16px;height:52px;border-radius:12px;display:none" id="collectBtn">
          ✓ I've collected my drinks
        </button>
        <button class="btn btn-secondary" style="margin-top:8px" id="newOrderBtn">Home</button>
      </div>
    </div>

  </div>

  <div class="bottom-bar" id="bottomBar" style="display:none">
    <button class="btn btn-secondary" id="backBtn">← Back</button>
    <button class="btn btn-primary" id="nextBtn">Next →</button>
  </div>
</div>

<div id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore-compat.js"></script>
<script src="../shared/version.js?v=1.0.141"></script>
<script src="../shared/firebase-config.js?v=1.0.141"></script>
<script src="../shared/a2hs.js?v=1.0.141"></script>
<script src="order.js?v=1.0.141"></script>
<script>
  document.addEventListener('gesturestart', e => e.preventDefault());
  // A pinch is 2+ simultaneous touch points — this is the reliable cross-browser check.
  // (e.scale only ever existed on Safari's legacy GestureEvent, never on TouchEvent/touchmove,
  // so the old `e.scale !== 1` version of this check never actually fired.)
  document.addEventListener('touchmove', e => { if (e.touches.length > 1) e.preventDefault(); }, { passive: false });
  // Trackpad pinch-zoom and Ctrl+scroll-wheel zoom both arrive as a 'wheel' event with
  // ctrlKey set (that's true even for a genuine pinch — browsers report it that way on purpose)
  // — this is the one extra gesture worth blocking for anyone using this on a laptop.
  document.addEventListener('wheel', e => { if (e.ctrlKey) e.preventDefault(); }, { passive: false });
</script>
</body>
</html>
