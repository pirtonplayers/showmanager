<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Verdict results</title>
  <link rel="stylesheet" href="style.css?v=1.1.201">
</head>
<body>
<main class="vote-card">
  <h1>Results</h1>
  <section class="results">
    <div class="bar-row"><span>Guilty</span><div class="bar"><i id="guiltyBar" class="guilty"></i></div><b id="guiltyCount">–</b></div>
    <div class="bar-row"><span>Not guilty</span><div class="bar"><i id="notGuiltyBar" class="not-guilty"></i></div><b id="notGuiltyCount">–</b></div>
    <p class="muted" id="total"></p>
  </section>
  <button class="vote-btn refresh" id="refreshBtn">Refresh</button>
  <p id="error" class="error" hidden></p>
</main>

<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-functions-compat.js"></script>
<script src="../shared/firebase-config.js?v=1.1.201"></script>
<script src="results.js?v=1.1.201"></script>
</body>
</html>
